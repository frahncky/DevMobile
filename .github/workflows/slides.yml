name: Compilar slides

on:
  push:
    paths: ["modulos/**", "estilo/**", ".github/workflows/slides.yml"]
  pull_request:
  workflow_dispatch:

jobs:
  slides:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilar todos os módulos
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: modulos
          root_file: modulo*.tex
      - name: Publicar PDFs como artefato
        uses: actions/upload-artifact@v4
        with:
          name: slides-devmobile
          path: modulos/*.pdf
